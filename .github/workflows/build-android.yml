name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Capacitor Android
        working-directory: frontend
        run: npm install @capacitor/android

      - name: Add Android platform
        working-directory: frontend
        run: npx cap add android

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert icon to PNG
        working-directory: frontend
        run: rsvg-convert -w 1024 -h 1024 resources/icon.svg -o resources/icon.png

      - name: Install icon generator
        working-directory: frontend
        run: npm install @capacitor/assets --save-dev

      - name: Generate app icons
        working-directory: frontend
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: littlesteps-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
